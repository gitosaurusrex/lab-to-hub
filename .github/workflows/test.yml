name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install git-filter-repo
      - run: shellcheck *.sh tests/*.sh tests/bin/gh
      - run: tests/run-tests.sh
